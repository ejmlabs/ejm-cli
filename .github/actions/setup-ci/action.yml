name: Prepare ejm-cli CI
description: Install the pinned relay build and browser-test prerequisites.
runs:
  using: composite
  steps:
    - name: Install pinned Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 26.12.0
        package-manager-cache: false

    - name: Install pinned npm
      shell: bash
      run: npm install --global --ignore-scripts npm@11.20.0

    - name: Install Linux native build prerequisites
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends pkg-config libdbus-1-dev gnome-keyring=46.1-2ubuntu0.2

    - name: Prepare an isolated Linux Secret Service
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        keyring_dir="$(mktemp -d "$RUNNER_TEMP/ejm-cli-keyring.XXXXXX")"
        install -d -m 700 "$keyring_dir/data" "$keyring_dir/runtime"
        export XDG_DATA_HOME="$keyring_dir/data"
        export XDG_RUNTIME_DIR="$keyring_dir/runtime"
        export DBUS_SESSION_BUS_ADDRESS
        DBUS_SESSION_BUS_ADDRESS="$(dbus-daemon --session --fork --print-address)"
        python3 -c 'import secrets; print(secrets.token_urlsafe(32))' |
          gnome-keyring-daemon --components=secrets --daemonize --unlock >/dev/null
        printf '%s\n' "XDG_DATA_HOME=$XDG_DATA_HOME" \
          "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" \
          "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"

    - name: Install the pinned Rust WebAssembly target
      shell: bash
      run: rustup target add --toolchain 1.99.1 wasm32-unknown-unknown

    # The release archive replaces a source build of about two minutes; each digest matches the release's published .sha256sum.
    - name: Install pinned wasm-bindgen CLI
      shell: bash
      run: |
        set -euo pipefail
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) target=x86_64-unknown-linux-musl digest=82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e ;;
          macOS/ARM64) target=aarch64-apple-darwin digest=81d4a23d56b3c3eb8187658329116d50e0b228a93b343825fb71f70179051cd1 ;;
          *) printf 'No pinned wasm-bindgen build for %s/%s\n' "$RUNNER_OS" "$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        name="wasm-bindgen-0.2.129-$target"
        archive="$RUNNER_TEMP/$name.tar.gz"
        curl --fail --silent --show-error --location --proto '=https' --output "$archive" \
          "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/$name.tar.gz"
        printf '%s  %s\n' "$digest" "$archive" | shasum -a 256 --check
        tar -xzf "$archive" -C "$RUNNER_TEMP" "$name/wasm-bindgen"
        install -m 755 "$RUNNER_TEMP/$name/wasm-bindgen" "${CARGO_HOME:-$HOME/.cargo}/bin/wasm-bindgen"

    - name: Install locked browser tools and Chrome
      if: ${{ hashFiles('product/relay/package.json') != '' }}
      shell: bash
      working-directory: ${{ github.action_path }}/../../../relay
      run: |
        npm ci --ignore-scripts
        npm exec --no -- playwright install --with-deps chrome

    - name: Record tool versions
      shell: bash
      run: |
        node --version
        npm --version
        wasm-bindgen --version
