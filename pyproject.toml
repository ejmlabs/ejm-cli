[project]
name = "ejm-cli-tooling"
version = "0.0.0"
description = "Development tools for the ejm-cli repository"
requires-python = ">=3.11"

[tool.uv]
package = false

[dependency-groups]
dev = [
  "mypy==2.4.0",
  "ruff==0.17.0",
  "shellcheck-py==0.11.0.1",
]

[tool.mypy]
strict = true
warn_unreachable = true
python_version = "3.11"
files = ["scripts"]
