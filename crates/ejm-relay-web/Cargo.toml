[package]
name = "ejm-relay-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Memory-only browser Noise adapter for ejm-cli remote sessions"

[package.metadata.cargo-machete]
# Enables getrandom 0.3/wasm_js for Snow through Cargo feature unification.
ignored = ["getrandom"]

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
# Enables numeric HTTP loopback for the debug-only offline browser fixture.
# The production build script never selects this feature.
test-loopback = []

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
snow = { version = "=0.10.0", default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }
wasm-bindgen = "=0.2.129"
base64 = "=0.23.1"
zeroize = "=1.9.1"
sha2 = "=0.10.9"
url = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Snow 0.10 uses getrandom 0.3. The browser backend uses Crypto.getRandomValues.
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
